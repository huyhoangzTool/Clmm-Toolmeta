<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Facebook Messenger Auto Sender</title>
<style>
  * { box-sizing: border-box; font-family: monospace; }
  body { background: #111; color: #0f0; padding: 20px; }
  h1 { color: #0f0; border-bottom: 1px solid #0f0; padding-bottom: 10px; }
  label { display: block; margin-top: 12px; color: #0f0; }
  input, textarea, select, button {
    width: 100%; padding: 8px; margin-top: 4px;
    background: #000; color: #0f0; border: 1px solid #0f0;
    font-family: monospace;
  }
  button { cursor: pointer; margin-top: 16px; background: #030; }
  button:hover { background: #060; }
  #log {
    margin-top: 20px; height: 300px; overflow-y: auto;
    background: #000; border: 1px solid #0f0; padding: 10px;
    white-space: pre-wrap; font-size: 12px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  #status { margin-top: 10px; color: #ff0; }
</style>
</head>
<body>

<h1>FB MESSENGER AUTO SENDER v1.0</h1>

<label>Cookie Facebook (dán toàn bộ cookie dạng string):</label>
<textarea id="cookie" rows="5" placeholder="c_user=...; xs=...; datr=...; fr=...;"></textarea>

<button id="loadGroups">1. Tải danh sách nhóm</button>

<label>Chọn nhóm để gửi:</label>
<select id="groupList"><option value="">-- Chưa tải --</option></select>

<label>Nội dung tin nhắn:</label>
<textarea id="message" rows="4" placeholder="Nhập nội dung..."></textarea>

<div class="row">
  <div>
    <label>Delay giữa các tin (giây):</label>
    <input type="number" id="delay" value="5" min="1">
  </div>
  <div>
    <label>Giới hạn số tin gửi:</label>
    <input type="number" id="limit" value="10" min="1">
  </div>
</div>

<button id="startSend">2. BẮT ĐẦU GỬI TỰ ĐỘNG</button>
<button id="stopSend" style="background:#300;">DỪNG</button>

<div id="status">Trạng thái: chờ</div>
<div id="log"></div>

<script>
/*
 * Script tự động gửi tin nhắn vào nhóm Messenger.
 * Lưu ý kỹ thuật:
 * - Facebook yêu cầu header đặc biệt (User-Agent, X-FB-LSD, etc.)
 * - Endpoint GraphQL thay đổi theo thời gian, cần cập nhật doc_id.
 * - Do CORS, script phải chạy qua proxy CORS hoặc trong môi trường
 *   cho phép (extension, node với fetch, hoặc userscript).
 * - Code dưới đây dùng fetch trực tiếp với proxy công khai để demo.
 */

const PROXY = "https://corsproxy.io/?url=";
let stopFlag = false;
let groupsCache = [];

const $ = id => document.getElementById(id);

function log(msg) {
  const el = $("log");
  const t = new Date().toLocaleTimeString();
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(s) { $("status").textContent = "Trạng thái: " + s; }

// Trích xuất cookie theo tên
function getCookieValue(cookieStr, name) {
  const m = cookieStr.match(new RegExp("(^|;\\s*)" + name + "=([^;]+)"));
  return m ? m[2] : null;
}

// Lấy fb_dtsg từ HTML trang chủ (dùng cho GraphQL)
async function fetchFbDtsg(cookie) {
  const url = PROXY + encodeURIComponent("https://www.facebook.com/");
  const res = await fetch(url, {
    headers: { "Cookie": cookie }
  });
  const html = await res.text();
  const m = html.match(/"DTSGInitialData",\[\],\{"token":"([^"]+)"/)
         || html.match(/name="fb_dtsg" value="([^"]+)"/);
  return m ? m[1] : null;
}

// Lấy LSD token
async function fetchLsd(cookie) {
  const url = PROXY + encodeURIComponent("https://www.facebook.com/");
  const res = await fetch(url, { headers: { "Cookie": cookie } });
  const html = await res.text();
  const m = html.match(/"LSD",\[\],\{"token":"([^"]+)"/);
  return m ? m[1] : null;
}

// Lấy userId từ cookie c_user
function getUserId(cookie) { return getCookieValue(cookie, "c_user"); }

/*
 * GraphQL query lấy danh sách thread (nhóm + inbox).
 * doc_id thay đổi theo thời gian. Giá trị dưới là bản cũ,
 * nếu lỗi cần cập nhật từ DevTools > Network.
 */
const DOC_ID_THREADS = "9389353197332982"; // có thể outdated

async function loadGroups() {
  const cookie = $("cookie").value.trim();
  if (!cookie) { log("LỖI: chưa nhập cookie"); return; }

  const uid = getUserId(cookie);
  if (!uid) { log("LỖI: cookie thiếu c_user"); return; }

  setStatus("đang tải token...");
  log("Đang lấy fb_dtsg và lsd...");

  let dtsg, lsd;
  try {
    dtsg = await fetchFbDtsg(cookie);
    lsd  = await fetchLsd(cookie);
  } catch (e) {
    log("LỖI fetch token: " + e.message);
    return;
  }
  if (!dtsg) { log("LỖI: không lấy được fb_dtsg"); return; }

  log("fb_dtsg=" + dtsg.slice(0,10) + "...");
  log("lsd=" + (lsd ? lsd.slice(0,10) : "null") + "...");

  setStatus("đang tải nhóm...");

  // Payload GraphQL lấy thread list
  const variables = {
    "0": {
      "cursor": null,
      "count": 30,
      "is_work_user": false,
      "include_thread_muted": true,
      "include_thread_archived": false,
      "include_thread_unread": true,
      "include_thread_participant": false,
      "include_thread_folder": null,
      "folder_tag": null,
      "include_thread_image": true,
      "include_thread_snippet": true,
      "include_thread_message_reaction": false
    }
  };

  const body = new URLSearchParams({
    "av": uid,
    "__user": uid,
    "__a": "1",
    "__req": "1",
    "fb_dtsg": dtsg,
    "lsd": lsd || "",
    "jazoest": "2" + Math.floor(Math.random()*10000),
    "queries": JSON.stringify({
      "o0": {
        "doc_id": DOC_ID_THREADS,
        "query_name": "MWInboxThreadsListPaginationQuery",
        "variables": variables
      }
    })
  });

  const endpoint = PROXY + encodeURIComponent("https://www.facebook.com/api/graphql/");

  let json;
  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "Cookie": cookie,
        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
      },
      body: body.toString()
    });
    json = await res.json();
  } catch (e) {
    log("LỖI request GraphQL: " + e.message);
    return;
  }

  // Parse danh sách thread
  try {
    const threads =
      json?.data?.o0?.viewer?.message_threads?.edges || [];

    groupsCache = threads.map(t => ({
      id: t.node.thread_key.thread_fbid,
      name: t.node.name || t.node.all_participants?.edges?.[0]?.node?.name || "Không tên"
    })).filter(g => g.id);

    const sel = $("groupList");
    sel.innerHTML = '<option value="">-- Chọn nhóm --</option>' +
      groupsCache.map(g => `<option value="${g.id}">${g.name}</option>`).join("");

    log("Đã tải " + groupsCache.length + " nhóm.");
    setStatus("sẵn sàng");
  } catch (e) {
    log("LỖI parse: " + e.message);
    log("Raw: " + JSON.stringify(json).slice(0, 500));
  }
}

/*
 * Gửi 1 tin nhắn vào thread.
 * Dùng endpoint /messaging/send/ (form cũ) hoặc GraphQL send.
 * Dưới đây dùng form /messaging/send/ để đơn giản.
 */
async function sendOne(cookie, dtsg, lsd, uid, threadId, text) {
  const endpoint = PROXY + encodeURIComponent(
    `https://www.facebook.com/messaging/send/?dpr=1`
  );

  const body = new URLSearchParams({
    "thread_fbid": threadId,
    "action_type": "ma-type:user-generated-message",
    "body": text,
    "client": "mercury",
    "author": "fbid:" + uid,
    "timestamp": Date.now(),
    "source": "source:chat:web",
    "offline_threading_id": Date.now() + "." + Math.floor(Math.random()*1e9),
    "message_id": Date.now() + "." + Math.floor(Math.random()*1e9),
    "ephemeral_ttl_mode": "0",
    "fb_dtsg": dtsg,
    "lsd": lsd || "",
    "jazoest": "2" + Math.floor(Math.random()*10000)
  });

  const res = await fetch(endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded",
      "Cookie": cookie,
      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
    },
    body: body.toString()
  });

  const txt = await res.text();
  return { ok: res.ok, status: res.status, body: txt.slice(0, 200) };
}

async function startSend() {
  stopFlag = false;

  const cookie = $("cookie").value.trim();
  const threadId = $("groupList").value;
  const text = $("message").value.trim();
  const delaySec = parseInt($("delay").value) || 5;
  const limit = parseInt($("limit").value) || 10;

  if (!cookie || !threadId || !text) {
    log("LỖI: thiếu cookie / nhóm / nội dung");
    return;
  }

  const uid = getUserId(cookie);
  setStatus("đang lấy token để gửi...");

  let dtsg, lsd;
  try {
    dtsg = await fetchFbDtsg(cookie);
    lsd  = await fetchLsd(cookie);
  } catch (e) {
    log("LỖI token: " + e.message);
    return;
  }
  if (!dtsg) { log("LỖI: không có fb_dtsg"); return; }

  setStatus("đang gửi...");
  let sent = 0;

  for (let i = 0; i < limit; i++) {
    if (stopFlag) { log("Đã dừng theo yêu cầu."); break; }

    try {
      const r = await sendOne(cookie, dtsg, lsd, uid, threadId, text);
      if (r.ok) {
        sent++;
        log(`[${sent}/${limit}] GỬI OK (HTTP ${r.status})`);
      } else {
        log(`[${sent+1}/${limit}] LỖI HTTP ${r.status}: ${r.body}`);
      }
    } catch (e) {
      log("LỖI mạng: " + e.message);
    }

    if (i < limit - 1 && !stopFlag) {
      log(`Chờ ${delaySec}s...`);
      await new Promise(res => setTimeout(res, delaySec * 1000));
    }
  }

  setStatus(`hoàn tất (${sent} tin)`);
  log(`=== KẾT THÚC: đã gửi ${sent} tin ===`);
}

// Gắn sự kiện
$("loadGroups").addEventListener("click", loadGroups);
$("startSend").addEventListener("click", startSend);
$("stopSend").addEventListener("click", () => {
  stopFlag = true;
  log("Yêu cầu dừng...");
});
</script>
</body>
</html>
